<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wormhole · 端到端加密聊天</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- 入口面板 -->
    <section id="panel-room" class="panel active">
      <div class="card">
        <h1>🕳️ Wormhole</h1>
        <p class="subtitle">端到端加密 · P2P 直连 · 消息不经服务器</p>
        <div class="field">
          <label for="room-input">房间名称</label>
          <input id="room-input" type="text" placeholder="例如：my-secret-room" maxlength="32" autocomplete="off" />
        </div>
        <div class="field">
          <label for="nick-input">昵称（可选）</label>
          <input id="nick-input" type="text" placeholder="你的昵称" maxlength="20" autocomplete="off" />
        </div>
        <div class="actions">
          <button id="btn-create" class="btn primary">创建房间</button>
          <button id="btn-join" class="btn secondary">加入房间</button>
        </div>
        <p class="hint">创建后分享链接，对方打开同一房间名即可握手连接。</p>
      </div>
    </section>

    <!-- 等待连接 -->
    <section id="panel-waiting" class="panel">
      <div class="card">
        <h2>等待对方加入…</h2>
        <div class="room-code" id="room-code-display"></div>
        <p class="hint">将以下链接发给对方，双方同时在线即可完成握手：</p>
        <input id="share-link" readonly class="share-link" />
        <button id="btn-copy" class="btn secondary">复制链接</button>
        <div id="conn-status" class="status">正在寻找对方…</div>
      </div>
    </section>

    <!-- 聊天面板 -->
    <section id="panel-chat" class="panel">
      <header class="chat-header">
        <button id="btn-back" class="btn-icon" title="返回">←</button>
        <span id="chat-peer" class="peer-name">—</span>
        <span id="chat-encryption" class="encryption-badge">🔒 AES-256-GCM</span>
      </header>
      <div id="messages" class="messages"></div>
      <form id="msg-form" class="input-bar">
        <input id="msg-input" type="text" placeholder="输入加密消息…" autocomplete="off" maxlength="4000" />
        <button type="submit" class="btn primary">发送</button>
      </form>
    </section>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
